:root { --bg: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --line: #e3e3e3; --brand: #B9023D; --chip: #f4f4f4; --stage: #ffffff; --stage-muted: #6b6b6b; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #ececec; --muted: #a0a0a0; --line: #333; --chip: #232323; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; z-index: 1; }
h1 { font-size: 16px; margin: 0 12px 0 0; }
label { color: var(--muted); display: flex; gap: 8px; align-items: center; }
input[type=text] { width: min(520px, 100%); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--chip); color: var(--fg); font: inherit; }
main { padding: 8px 24px 48px; background: var(--stage); min-height: 60vh; }
main section { border-color: color-mix(in srgb, var(--stage-muted) 25%, transparent); }
main h2, main .tag { color: var(--stage-muted); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; }
#controls { gap: 12px 20px; }
.bar > .lab { color: var(--muted); font-size: 13px; margin-right: 4px; min-width: 40px; }
.sw { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 6px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--chip); color: var(--fg); font: 12px/1.2 inherit; font-family: inherit; cursor: pointer; }
.sw .dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); flex: none; }
.sw .hex { color: var(--muted); font-variant-numeric: tabular-nums; }
.sw[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg) inset; }
.sw:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
#contrast { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#contrast b { color: var(--fg); font-weight: 600; }
section { border-bottom: 1px solid var(--line); padding: 18px 0; }
h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.row { display: grid; grid-template-columns: 74px 1fr; align-items: baseline; gap: 8px; }
.tag { font-size: 11px; color: var(--muted); }
.s { font-family: "FnGuide Logotype", serif; color: var(--brand); white-space: nowrap; overflow-x: auto; line-height: 1.25; }
.off { font-kerning: none; font-feature-settings: "kern" 0, "liga" 0; opacity: .55; }
.on  { font-kerning: normal; font-feature-settings: "kern" 1, "liga" 1; }
body.single .off, body.single .tag-off { display: none; }
</style></head>
<body>
<header>
  <h1>FnGuide Logotype v1.100 · 최종 커닝·합자 교정지</h1>
  <div class="bar" id="colors" role="group" aria-label="글자색"><span class="lab">글자색</span></div>
  <div class="bar" id="stages" role="group" aria-label="미리보기 배경"><span class="lab">배경</span><span id="contrast" aria-live="polite"></span></div>
  <div class="bar" id="controls">
  <label>직접 입력 <input type="text" id="custom" value="FnGuide Logotype Font : Your Best Financial Guide"></label>
  <label>크기 <input type="range" id="size" min="16" max="160" value="56"> <span id="sizev">56px</span></label>
  <label><input type="checkbox" id="single" checked> 적용본만 보기</label>
  </div>
</header>
<main id="main"></main>
<script>
const groups = [
  ["직접 입력", ["__custom__"]],
  ["로고 단어 — 공식 로고와 같은 간격", ["__logo__"]],
  ["대문자만 — API 로고 참고 리듬", ["ETF GLOBAL KOSPI KOSDAQ", "MARKET INTELLIGENCE REPORT", "VALUE YIELD TOTAL RETURN"]],
  ["대문자 사선", ["HAVAH HVAVH HAYAH HATAH", "AVAILABLE LATVIA TAYLOR", "HLTLH HLVLH HLYLH HPAPH HFAFH", "HVOVH HYOYH HTOTH HKOKH HXOXH"]],
  ["대문자 → 소문자", ["nTanTenTonTrnTunTyn", "nVanVenVonWanWenWonYanYenYon", "nFanFenFonPanPenPon"]],
  ["소문자", ["nvonvenwonwenyonyenxon", "noonnoennecnnoen", "fl fb fh  gj qj jj  fi ff"]],
  ["문장부호", ["T. V. W. Y. F. P. r. v. y.", "T, V, W, Y, F, P, r, v, y,", "\u201cA\u201d \u2018A\u2019 L\u2019 \u201cT\u201d \u2018V\u2019 \u201cW\u201d \u2018Y\u2019", "T\u2013V A\u2013Y -T- -V-"]],
  ["f 합자", ["fi fl ff ffi ffl fb fh fk", "office affluent fish flow offbeat halfhearted", "first official profile"]],
  ["숫자 — 정렬 유지를 위해 커닝 없음", ["0.4 1.7 2026.10.26 $1,250.00 +3.5%"]],
  ["문장", ["Taiwan, Vietnam & Yonsei \u2013 \u201cAVA\u201d LT", "Today\u2019s Top Value: Wave, Yield, Pay.", "lowly avoid every eye yawn waxy"]]
];
const main = document.getElementById("main"), custom = document.getElementById("custom");
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function render() {
  main.textContent = "";
  for (const [title, lines] of groups) {
    const sec = el("section"); sec.appendChild(el("h2", null, title));
    for (const raw of lines) {
      const t = raw === "__custom__" ? (custom.value || " ") : raw === "__logo__" ? logoLine() : raw;
      for (const [cls, tag] of [["off", "커닝·합자 끔"], ["on", "커닝·합자 켬"]]) {
        const row = el("div", "row");
        row.appendChild(el("span", "tag tag-" + cls, tag));
        row.appendChild(el("div", "s " + cls, t));
        sec.appendChild(row);
      }
    }
    main.appendChild(sec);
  }
  setSize();
}
function setSize() {
  const v = document.getElementById("size").value;
  document.getElementById("sizev").textContent = v + "px";
  document.querySelectorAll(".s").forEach(e => e.style.fontSize = v + "px");
}
custom.addEventListener("input", render);
document.getElementById("size").addEventListener("input", setSize);
document.getElementById("single").addEventListener("change", e => document.body.classList.toggle("single", e.target.checked));
document.body.classList.toggle("single", document.getElementById("single").checked);
const PALETTE = [
  ["B2B 대표상품 (FnRed)", "#B9023D"],
  ["B2B 계약상품", "#1C1C3A"],
  ["Fund", "#0C3178"],
  ["Index", "#45B792"],
  ["B2C (리타민)", "#26C0D2"],
  ["B2C (API)", "#2457C5"],
  ["FnGuide CI (FnWine)", "#94243A"]
];
const LOGO_BASE = "FnGuide DataGuide WiseReport";
const LOGO_EXTRA = { "#1C1C3A": "ETF Global", "#0C3178": "FundGuide", "#45B792": "FnIndex", "#2457C5": "FnAPI" };
// [이름, 배경, 보조 글자색, 고정 글자색(다크모드만)]
const STAGES = [["흰색", "#FFFFFF", "#6B6B6B"], ["연회색", "#F2F2F2", "#666666"], ["검정", "#111111", "#9A9A9A"],
                ["다크모드", "#000000", "#9A9A9A", "#FFFFFF"]];
const DARK = "다크모드";
const root = document.documentElement.style;
const state = { color: PALETTE[0][1], stage: "흰색", lastStage: "흰색" };
try {
  const v = JSON.parse(localStorage.getItem("fnguide-proof") || "{}");
  if (v.color) state.color = v.color;
  if (STAGES.some(x => x[0] === v.stage)) state.stage = v.stage;
  if (STAGES.some(x => x[0] === v.lastStage && x[0] !== DARK)) state.lastStage = v.lastStage;
} catch (e) {}
function save() { try { localStorage.setItem("fnguide-proof", JSON.stringify(state)); } catch (e) {} }
const stageOf = name => STAGES.find(x => x[0] === name) || STAGES[0];
const isDark = () => state.stage === DARK;
const textColor = () => isDark() ? stageOf(DARK)[3] : state.color;           // 다크모드는 글자색 #FFF 고정
function logoLine() { const x = isDark() ? null : LOGO_EXTRA[state.color]; return x ? LOGO_BASE + " " + x : LOGO_BASE; }
function lum(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function updateContrast() {
  const r = contrast(textColor(), stageOf(state.stage)[1]);
  const grade = r >= 7 ? "AAA" : r >= 4.5 ? "AA" : r >= 3 ? "AA 큰 글자만" : "기준 미달";
  document.getElementById("contrast").innerHTML = "명도 대비 <b>" + r.toFixed(2) + " : 1</b> · " + grade;
}
const colorBar = document.getElementById("colors"), stageBar = document.getElementById("stages");
const swatches = [], stageBtns = [];
function swatch(label, hex, onPick, sub) {
  const b = el("button", "sw"); b.type = "button";
  const d = el("span", "dot"); d.style.background = hex; b.appendChild(d);
  b.appendChild(el("span", null, label)); if (sub) b.appendChild(el("span", "hex", sub));
  b.addEventListener("click", onPick); return b;
}
function apply() {
  const st = stageOf(state.stage);
  root.setProperty("--brand", textColor()); root.setProperty("--stage", st[1]); root.setProperty("--stage-muted", st[2]);
  swatches.forEach(([b, h]) => b.setAttribute("aria-pressed", String(!isDark() && h === state.color)));
  stageBtns.forEach(([b, n]) => b.setAttribute("aria-pressed", String(n === state.stage)));
  picker.value = textColor().toLowerCase();
  updateContrast(); save(); render();
}
function setColor(hex) {
  state.color = hex.toUpperCase();
  if (isDark()) state.stage = state.lastStage;      // 다크모드에서 색을 고르면 직전 배경으로 돌아가 그 색을 적용
  apply();
}
function setStage(name) {
  if (name !== DARK) state.lastStage = name;
  state.stage = name; apply();
}
for (const [name, hex] of PALETTE) {
  const b = swatch(name, hex, () => setColor(hex), hex);
  swatches.push([b, hex]); colorBar.appendChild(b);
}
const pick = el("label"); pick.appendChild(el("span", null, "직접 선택"));
const picker = document.createElement("input"); picker.type = "color"; picker.setAttribute("aria-label", "글자색 직접 선택");
picker.addEventListener("input", e => setColor(e.target.value)); pick.appendChild(picker); colorBar.appendChild(pick);
for (const [name, bg, , fixed] of STAGES) {
  const b = swatch(name, bg, () => setStage(name), fixed ? "글자 " + fixed : null);
  stageBtns.push([b, name]); stageBar.insertBefore(b, document.getElementById("contrast"));
}
apply();

</script>
</body></html>
